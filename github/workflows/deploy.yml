name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install

      - name: Basic server validation
        run: |
          node -e "require('fs').existsSync('backend/index.js') && console.log('Backend exists')"

      # Deploy frontend to Vercel
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v20
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./taptapboss/frontend
          vercel-args: '--prod'

      # Trigger backend deployment on Render or other provider
      - name: Trigger Render Backend Deploy
        uses: swillson/render-deploy@v1
        if: env.RENDER_API_KEY != ''
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_SERVICE_ID }}

      - name: Post-deploy health check
        run: |
          echo "Deployment triggered. Health check will be performed by backend service."